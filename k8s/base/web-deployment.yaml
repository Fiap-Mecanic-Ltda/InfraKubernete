apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanicltda-web
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: web
spec:
  # O HPA (web-hpa.yaml) controla o número de réplicas em execução; este valor
  # só vale enquanto o HPA ainda não calculou uma recomendação.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: mechanicltda-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: mechanicltda-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: JWT_SECRET_KEY
            - name: Encryption__CpfCnpjKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: ENCRYPTION_KEY
            # Indice cego do CPF/CNPJ: mesmo valor usado pela Lambda de
            # autenticacao, senao o hash gravado aqui nao casa com o consultado la.
            - name: Encryption__CpfCnpjHashKey
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: CPF_HASH_KEY
            # New Relic: "1" liga o profiler do agente .NET instalado na imagem. As
            # duas chaves são opcionais - sem elas (overlay local, ou sem license key),
            # vale o CORECLR_ENABLE_PROFILING=0 do Dockerfile.
            - name: CORECLR_ENABLE_PROFILING
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: NEW_RELIC_PROFILING
                  optional: true
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: NEW_RELIC_LICENSE_KEY
                  optional: true
            - name: NEW_RELIC_APP_NAME
              value: "mechanicltda-web"
            - name: EmailSettings__Password
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: EmailSettings__Password
            - name: AppSettings__BaseUrlAprovacao
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: AppSettings__BaseUrlAprovacao
            # Link "API" do cabecalho do Web. Opcional: sem a chave (overlay
            # local), o Web monta hostname:8080/swagger como antes.
            - name: AppSettings__UrlSwaggerApi
              valueFrom:
                secretKeyRef:
                  name: mechanicltda-secrets
                  key: AppSettings__UrlSwaggerApi
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          # Cobre o tempo de migration com retry (ate 100s) sem deixar o
          # liveness/readiness matar o container no meio do boot - sem isso,
          # o probe reiniciava o pod antes da migration terminar.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 6
