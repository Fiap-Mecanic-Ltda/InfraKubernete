# Requer o metrics-server instalado no cluster para expor métricas de CPU/memória.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mechanicltda-web
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mechanicltda-web
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
