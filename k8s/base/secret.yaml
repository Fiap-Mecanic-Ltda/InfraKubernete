# ⚠️ Segredos de exemplo — NÃO use estes valores nem comite valores reais neste arquivo.
#
# - overlays/local: substitua via `kubectl create secret ... --dry-run=client -o yaml`
#   (ver k8s/README.md) antes de aplicar.
# - overlays/prod: a pipeline de CI/CD recria este Secret em runtime a partir do SSM
#   Parameter Store (ver .github/workflows/deploy.yml) — o conteúdo abaixo nunca é
#   aplicado em produção.
apiVersion: v1
kind: Secret
metadata:
  name: mechanicltda-secrets
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
type: Opaque
stringData:
  SA_PASSWORD: "CHANGE_ME_StrongPassword123!"
  JWT_SECRET_KEY: "CHANGE_ME_jwt_secret_key_min_32_characters"
  ENCRYPTION_KEY: "CHANGE_ME_encryption_key_min_32_characters"
  CPF_HASH_KEY: "CHANGE_ME_cpf_hash_key_min_32_characters"
  ConnectionStrings__DefaultConnection: "Server=mechanicltda-sqlserver;Database=MechanicLtdaDb;User Id=sa;Password=CHANGE_ME_StrongPassword123!;TrustServerCertificate=True;"
  EmailSettings__Password: "CHANGE_ME_gmail_app_password"
  AppSettings__BaseUrlAprovacao: "http://localhost:8080"
