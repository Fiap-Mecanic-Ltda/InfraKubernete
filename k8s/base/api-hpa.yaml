# Requer o metrics-server instalado no cluster para expor métricas de CPU/memória.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mechanicltda-api
  namespace: mechanicltda
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mechanicltda-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Só CPU. Escalar por memória não funciona nesta aplicação: o consumo é
    # quase todo custo fixo por pod (runtime .NET mais o agente APM). Passando
    # do alvo, o HPA vai para maxReplicas, e cada réplica nova repete o mesmo
    # consumo — a utilização não cai e ele fica cravado no máximo, enchendo o
    # cluster de pods. CPU, essa sim, dilui entre réplicas.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
