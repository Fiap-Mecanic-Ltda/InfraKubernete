apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mechanicltda

resources:
  - ../../base
  - sqlserver-pvc.yaml
  - sqlserver-deployment.yaml
  - sqlserver-service.yaml

# Só neste overlay o SQL Server roda como pod — API e Web precisam esperar a
# ordem de subida (sqlserver → api → web), igual ao docker-compose.yml local.
patches:
  - target:
      kind: Deployment
      name: mechanicltda-api
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-sqlserver
            image: busybox:1.36
            command:
              - sh
              - -c
              - until nc -z -w2 mechanicltda-sqlserver 1433; do echo "aguardando sqlserver..."; sleep 2; done
  - target:
      kind: Deployment
      name: mechanicltda-web
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-for-api
            image: busybox:1.36
            command:
              - sh
              - -c
              - until wget -q -T2 -O- http://mechanicltda-api:8080/health; do echo "aguardando api..."; sleep 2; done
