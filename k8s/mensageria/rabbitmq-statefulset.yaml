# Uma replica so: o projeto nao precisa de cluster de RabbitMQ. As filas da Saga
# sao duraveis e ficam no PVC (local-path do k3s), entao o volume fica preso ao
# no em que foi criado - por isso o pod e fixado no server k3s, que nao e
# substituido pelo ASG como os workers.
#
# O Secret "rabbitmq-credentials" (usuario e senha) e montado pela pipeline de
# deploy a partir do SSM (/<projeto>/<ambiente>/mensageria/*). Nao ha placeholder
# versionado.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: mensageria
  labels:
    app.kubernetes.io/part-of: mechanicltda
    app.kubernetes.io/name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
    spec:
      # O broker nao fala com a API do Kubernetes: sem token da service account
      # montado no pod.
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      # A imagem oficial roda como o usuario rabbitmq (999) quando nao inicia
      # como root; o fsGroup deixa o PVC gravavel por ele.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: usuario
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: segredo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
