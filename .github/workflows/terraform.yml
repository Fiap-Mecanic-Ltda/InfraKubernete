name: Terraform - Infraestrutura AWS

# Provisiona a infraestrutura de Kubernetes (VPC, EC2 com k3s, ASG de workers,
# ECR, SSM, IAM/OIDC). O RDS fica no repositorio de infra do banco gerenciado. O `plan` roda sozinho a cada mudança em infra/; o `apply` é sempre
# manual (workflow_dispatch), porque recria recursos com custo e downtime.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "O que rodar (apply exige aprovação do Environment production)"
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read

jobs:
  # Lê os defaults direto do variables.tf, para não duplicar esses valores como
  # Repository Variables no GitHub (fonte única de verdade).
  read-tf-vars:
    name: Lê variáveis padrão do Terraform
    runs-on: ubuntu-latest
    outputs:
      aws_region: ${{ steps.vars.outputs.aws_region }}
    steps:
      - uses: actions/checkout@v4

      - name: Extrai defaults do variables.tf
        id: vars
        run: |
          value=$(awk '/variable "aws_region"/,/^}/' infra/variables.tf | grep default | sed -E 's/.*default[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')
          if [ -z "$value" ]; then
            echo "::error::Não encontrei o default de aws_region em infra/variables.tf"
            exit 1
          fi
          echo "aws_region=$value" >> "$GITHUB_OUTPUT"

  # Usa a chave estática do terraform-deployer (não OIDC): a role de OIDC
  # (github_oidc.tf) é criada POR este apply, então no bootstrap o CI ainda não
  # tem como assumi-la.
  plan:
    name: Terraform plan
    needs: read-tf-vars
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_ec2_key_pair_name: mechanicltda-prod
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_encryption_cpf_cnpj_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_cpf_hash_key: ${{ secrets.CPF_HASH_KEY }}
      TF_VAR_email_password: ${{ secrets.EMAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

  apply:
    name: Terraform apply
    needs: [read-tf-vars, plan]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_ec2_key_pair_name: mechanicltda-prod
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_encryption_cpf_cnpj_key: ${{ secrets.ENCRYPTION_KEY }}
      TF_VAR_cpf_hash_key: ${{ secrets.CPF_HASH_KEY }}
      TF_VAR_email_password: ${{ secrets.EMAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura credenciais AWS (chave estática do terraform-deployer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.read-tf-vars.outputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      # Depois de um apply que recria a EC2, os manifestos precisam ser
      # reaplicados no cluster novo — o deploy.yml faz isso e pode ser
      # disparado manualmente logo em seguida.
      - name: Outputs (para cadastrar os secrets do GitHub)
        run: terraform output
